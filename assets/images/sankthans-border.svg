<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="422" viewBox="0 0 2000 422">
  <defs>
    <linearGradient id="midsummer-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A237E"/>
      <stop offset="50%" style="stop-color:#303F9F"/>
      <stop offset="100%" style="stop-color:#FF8A65"/>
    </linearGradient>
    <linearGradient id="fire" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#FF5722"/>
      <stop offset="50%" style="stop-color:#FF9800"/>
      <stop offset="100%" style="stop-color:#FFEB3B"/>
    </linearGradient>
  </defs>
  <rect width="2000" height="422" fill="url(#midsummer-sky)"/>
  
  <!-- Bål 1 -->
  <g transform="translate(200, 320)">
    <!-- Brænde -->
    <rect x="-50" y="20" width="100" height="15" fill="#5D4037" rx="3"/>
    <rect x="-45" y="10" width="90" height="12" fill="#6D4C41" rx="3" transform="rotate(-10 0 16)"/>
    <rect x="-40" y="15" width="85" height="12" fill="#795548" rx="3" transform="rotate(8 0 21)"/>
    <!-- Flammer -->
