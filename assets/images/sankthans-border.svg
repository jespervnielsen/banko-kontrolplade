    <ellipse cx="-15" cy="-10" rx="20" ry="40" fill="#FFEB3B" opacity="0.8"/>
    <ellipse cx="15" cy="-15" rx="18" ry="35" fill="#FFEB3B" opacity="0.8"/>
    <ellipse cx="0" cy="-30" rx="12" ry="25" fill="#FFF9C4" opacity="0.9"/>
    <!-- Gnister -->
    <circle cx="-25" cy="-60" r="3" fill="#FFEB3B"/>
    <circle cx="20" cy="-70" r="2" fill="#FF9800"/>
    <circle cx="5" cy="-80" r="2.5" fill="#FFEB3B"/>
    <circle cx="-10" cy="-75" r="2" fill="#FF9800"/>
  </g>
  
