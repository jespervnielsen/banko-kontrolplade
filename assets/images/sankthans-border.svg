    <rect x="-50" y="14" width="100" height="13" fill="#6D4C41" rx="3" transform="rotate(-8 0 20)"/>
    <rect x="-45" y="18" width="95" height="13" fill="#795548" rx="3" transform="rotate(6 0 24)"/>
    <ellipse cx="0" cy="-25" rx="40" ry="55" fill="url(#fire)" opacity="0.9"/>
    <ellipse cx="-18" cy="-15" rx="22" ry="45" fill="#FFEB3B" opacity="0.8"/>
    <ellipse cx="18" cy="-20" rx="20" ry="40" fill="#FFEB3B" opacity="0.8"/>
    <ellipse cx="0" cy="-35" rx="14" ry="28" fill="#FFF9C4" opacity="0.9"/>
