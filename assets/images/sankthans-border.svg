  <circle cx="300" cy="50" r="2" fill="#FFF9C4"/>
  <circle cx="500" cy="35" r="1.5" fill="#FFF9C4"/>
  <circle cx="600" cy="55" r="2" fill="#FFF9C4"/>
  <circle cx="800" cy="40" r="1.5" fill="#FFF9C4"/>
  <circle cx="900" cy="30" r="2" fill="#FFF9C4"/>
  <circle cx="1200" cy="45" r="1.5" fill="#FFF9C4"/>
  <circle cx="1350" cy="35" r="2" fill="#FFF9C4"/>
  <circle cx="1450" cy="50" r="1.5" fill="#FFF9C4"/>
  <circle cx="1550" cy="30" r="2" fill="#FFF9C4"/>
  <circle cx="1750" cy="45" r="1.5" fill="#FFF9C4"/>
  <circle cx="1900" cy="35" r="2" fill="#FFF9C4"/>
  <circle cx="1980" cy="55" r="1.5" fill="#FFF9C4"/>
